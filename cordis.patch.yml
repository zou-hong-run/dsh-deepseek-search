# dsh-deepseek-search bundle patch — applied when this package is added as a
# profile bundle (`plugin_manager` install_bundle, or the Plugins page).
#
# Registers the DeepSeek-backed providers and pins both web capabilities to
# them. A target row's `config` is replaced wholesale, never deep-merged, so
# every key the deployment needs is restated here.
- insert:
    - id: dsh-deepseek-search
      name: 'dsh-deepseek-search'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-search
    fetchProvider: deepseek-search
